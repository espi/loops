name: kb-size

# Word budgets for every file the routines write (guardrails/BUDGETS.md).
# A budget the agent grades itself on is no budget, so it is checked here.
# A line cap on one file held the lines while the words moved to the files
# beside it (Sep to Nov 2026); so the caps are in words, on every file, and
# on the folder. Raising a cap is a human-authored change to BUDGETS.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check word budgets against the base branch
        run: python3 scripts/kb_budget.py --base "origin/${{ github.base_ref }}"
      - name: Check the pull request body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          words=$(printf '%s' "$BODY" | wc -w)
          echo "pull request body: $words words (limit 600)"
          if [ "$words" -gt 600 ]; then
            echo "::error::The pull request body is $words words, over 600. Lead with the decisions needed; put the rest in the diff."
            exit 1
          fi
